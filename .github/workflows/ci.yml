name: Pipeline DevSecOps - Build, SCA, SAST, Docker & DAST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: Compilación básica (.NET)
  # -------------------------------------------------------------
  build:
    name: 1. Compilación (.NET)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compilar solución
      run: dotnet build --configuration Release

  # -------------------------------------------------------------
  # ETAPA 2: Análisis SCA (Dependencias)
  # -------------------------------------------------------------
  sca-security:
    name: 2. Análisis SCA (Dependencias)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Generar reporte de dependencias
      run: |
        echo "==========================================" > sca-report.txt
        echo "REPORTE DE AUDITORÍA SCA - NUGET PACKAGES" >> sca-report.txt
        echo "==========================================" >> sca-report.txt
        dotnet list package --vulnerable >> sca-report.txt || true

    - name: Publicar Artefacto SCA
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Reporte-Vulnerabilidades-SCA
        path: sca-report.txt

    - name: Validar dependencias vulnerables
      run: |
        REPORT=$(dotnet list package --vulnerable)
        if echo "$REPORT" | grep -i "has the following vulnerable"; then
          echo "❌ ERROR DE SEGURIDAD (SCA): Se encontraron librerías vulnerables."
          exit 1
        fi

  # -------------------------------------------------------------
  # ETAPA 3: Análisis SAST (SonarCloud)
  # -------------------------------------------------------------
  sast-sonarcloud:
    name: 3. Análisis SAST (SonarCloud)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: SAST - Iniciar SonarCloud
      run: |
        dotnet-sonarscanner begin \
          /k:"cesarrhf_devsecops-demo" \
          /o:"tarea4-testing" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.qualitygate.wait=true

    - name: Compilar y capturar logs de análisis
      run: |
        echo "==========================================" > sast-report.txt
        echo "REPORTE DE ANÁLISIS CÓDIGO ESTÁTICO (SAST)" >> sast-report.txt
        echo "==========================================" >> sast-report.txt
        dotnet build --configuration Release "/flp:v=detailed;logfile=build-analysis.log" || true
        cat build-analysis.log >> sast-report.txt

    - name: Publicar Artefacto SAST
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Reporte-Analisis-SAST
        path: sast-report.txt

    - name: SAST - Finalizar SonarCloud
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # -------------------------------------------------------------
  # ETAPA 4: Despliegue en Docker + Análisis Dinámico DAST (OWASP ZAP)
  # -------------------------------------------------------------
  dast-security:
    name: 4. Despliegue Docker & Análisis DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sca-security, sast-sonarcloud]
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Construir Imagen Docker
      run: docker build -t devsecops-demo-app .

    - name: Desplegar Contenedor en Runner
      run: |
        docker run -d -p 5000:8080 --name app-test devsecops-demo-app
        sleep 5

    - name: Verificar Disponibilidad del Servicio
      run: curl -I http://localhost:5000 || exit 1

    - name: Ejecutar Escaneo DAST con OWASP ZAP
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:5000'
        token: ${{ secrets.GITHUB_TOKEN }}
        issue_title: 'Alerta de Seguridad DAST - OWASP ZAP'
        fail_action: false

    - name: Detener y Limpiar Contenedor
      if: always()
      run: |
        docker stop app-test || true
        docker rm app-test || true
