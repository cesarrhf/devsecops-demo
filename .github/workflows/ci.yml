name: Pipeline DevSecOps - Build, SCA & SAST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: Compilación básica
  # -------------------------------------------------------------
  build:
    name: 1. Compilación (.NET)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compilar solución
      run: dotnet build --configuration Release

  # -------------------------------------------------------------
  # ETAPA 2: Análisis SCA (En paralelo tras compilar)
  # -------------------------------------------------------------
  sca-security:
    name: 2. Análisis SCA (Dependencias)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Auditar dependencias vulnerables
      run: dotnet list package --vulnerable || true

  # -------------------------------------------------------------
  # ETAPA 3: Análisis SAST (En paralelo tras compilar)
  # -------------------------------------------------------------
  sast-sonarcloud:
    name: 3. Análisis SAST (SonarCloud)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: SAST - Iniciar SonarCloud
      run: |
        dotnet-sonarscanner begin \
          /k:"cesarrhf_devsecops-demo" \
          /o:"tarea4-testing" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io"

    - name: Compilar para análisis
      run: dotnet build --configuration Release

    - name: SAST - Finalizar SonarCloud
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}" || true
