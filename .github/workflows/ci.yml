name: Pipeline DevSecOps - Build, SCA, SAST, Docker & DAST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Variable global para el nombre de la imagen en Docker Hub test
env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USER }}/devsecops-demo

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: Compilación básica (.NET)
  # -------------------------------------------------------------
  build:
    name: 1. Compilación (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar solución
        run: dotnet build --configuration Release

  # -------------------------------------------------------------
  # ETAPA 2: Análisis SCA (Dependencias)
  # -------------------------------------------------------------
  sca-security:
    name: 2. Análisis SCA (Dependencias)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generar reporte de dependencias
        run: |
          echo "==========================================" > sca-report.txt
          echo "REPORTE DE AUDITORÍA SCA - NUGET PACKAGES" >> sca-report.txt
          echo "==========================================" >> sca-report.txt
          dotnet list package --vulnerable >> sca-report.txt || true

      - name: Publicar Artefacto SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reporte-Vulnerabilidades-SCA
          path: sca-report.txt

      - name: Validar dependencias vulnerables
        continue-on-error: true # Permite continuar la ejecución aunque existan fallos
        run: |
          REPORT=$(dotnet list package --vulnerable)
          if echo "$REPORT" | grep -i "has the following vulnerable"; then
            echo "❌ ERROR DE SEGURIDAD (SCA): Se encontraron librerías vulnerables."
            exit 1
          fi

  # -------------------------------------------------------------
  # ETAPA 3: Análisis SAST (SonarCloud)
  # -------------------------------------------------------------
  sast-sonarcloud:
    name: 3. Análisis SAST (SonarCloud)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SAST - Iniciar SonarCloud
        run: |
          dotnet-sonarscanner begin \
            /k:"cesarrhf_devsecops-demo" \
            /o:"tarea4-testing" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true

      - name: Compilar y capturar logs de análisis
        run: |
          echo "==========================================" > sast-report.txt
          echo "REPORTE DE ANÁLISIS CÓDIGO ESTÁTICO (SAST)" >> sast-report.txt
          echo "==========================================" >> sast-report.txt
          dotnet build --configuration Release "/flp:v=detailed;logfile=build-analysis.log" || true
          cat build-analysis.log >> sast-report.txt

      - name: Publicar Artefacto SAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reporte-Analisis-SAST
          path: sast-report.txt

      - name: SAST - Finalizar SonarCloud
        continue-on-error: true # Permite continuar aunque falle el Quality Gate
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # -------------------------------------------------------------
  # ETAPA 4: Docker Build & Push
  # -------------------------------------------------------------
  DockerBuild:
    name: 4. Docker Build & Push
    needs: [build, sca-security, sast-sonarcloud]
    if: always() # Se ejecuta aunque SCA o SAST hayan marcado error
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKER_IMAGE }}:latest .
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

# -------------------------------------------------------------
  # ETAPA 5: Image Security Scan (Trivy)
  # -------------------------------------------------------------
  ImageSecurity:
    name: 5. Escaneo de Imagen (Trivy)
    needs: DockerBuild
    runs-on: ubuntu-latest
    steps:
      - name: Escanear imagen con Trivy y exportar reporte
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: 'json' # Cambiamos a json para poder guardarlo y leerlo fácilmente
          output: 'trivy-report.json'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Publicar Artefacto Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-Seguridad-Trivy
          path: trivy-report.json

  # -------------------------------------------------------------
  # ETAPA 6: Análisis DAST (OWASP ZAP)
  # -------------------------------------------------------------
  DAST:
    name: 6. Análisis DAST (OWASP ZAP)
    needs: DockerBuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear red Docker aislada
        run: docker network create zap-net

      - name: Desplegar aplicación en contenedor
        run: |
          docker run --name webapp-${{ github.sha }} \
            --network zap-net \
            -p 5000:8080 -d \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Esperar disponibilidad del servicio
        run: sleep 10

      - name: Preparar permisos del workspace para ZAP
        run: |
          mkdir -p ${{ github.workspace }}/zap-report-dir
          chmod 777 ${{ github.workspace }}/zap-report-dir

      - name: Escaneo DAST con OWASP ZAP
        run: |
          docker run --rm --network zap-net \
            -v ${{ github.workspace }}/zap-report-dir:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://webapp-${{ github.sha }}:8080/ \
            -r zap_report.html \
            -I || true

      - name: Limpiar contenedor webapp tras análisis
        if: always()
        run: |
          docker rm -f webapp-${{ github.sha }} || true
          docker network rm zap-net || true

      - name: Publicar Reporte OWASP ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-OWASP-ZAP
          path: zap-report-dir/zap_report.html
  # -------------------------------------------------------------
  # ETAPA 7: Despliegue Final
  # -------------------------------------------------------------
  DEPLOY:
    name: 7. Despliegue Final
    needs: [ ImageSecurity, DAST ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirmación de Despliegue
        run: echo "🚀 Despliegue finalizado exitosamente con la imagen ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"