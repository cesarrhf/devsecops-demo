name: Pipeline DevSecOps - Build, SCA, SAST & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: Compilación básica
  # -------------------------------------------------------------
  build:
    name: 1. Compilación (.NET)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compilar solución
      run: dotnet build --configuration Release

  # -------------------------------------------------------------
  # ETAPA 2A: Análisis SCA Rápido (Gatekeeper diario)
  # -------------------------------------------------------------
  sca-security:
    name: 2A. Análisis SCA Rápido (Dependencias)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Generar reporte de dependencias
      run: |
        echo "==========================================" > sca-report.txt
        echo "REPORTE DE AUDITORÍA SCA - NUGET PACKAGES" >> sca-report.txt
        echo "==========================================" >> sca-report.txt
        dotnet list package --vulnerable >> sca-report.txt || true

    - name: Publicar Artefacto SCA (Texto)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Reporte-Vulnerabilidades-SCA
        path: sca-report.txt

    - name: Validar dependencias vulnerables
      run: |
        REPORT=$(dotnet list package --vulnerable)
        if echo "$REPORT" | grep -i "has the following vulnerable"; then
          echo "❌ ERROR DE SEGURIDAD (SCA): Se encontraron librerías vulnerables."
          exit 1
        fi

# -------------------------------------------------------------
  # ETAPA 2B: Análisis SCA Profundo (OWASP Dependency-Check)
  # -------------------------------------------------------------
  sca-deep-audit:
    name: 2B. SCA Profundo (OWASP Reporte HTML)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publicar binarios y dependencias locales
      run: dotnet publish -c Release -o ./output

    - name: Crear directorio de salida
      run: mkdir -p reports

    - name: Ejecutar OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'DevSecOps-Demo'
        path: './output'
        format: 'HTML'
        out: 'reports'
        args: '--failOnCVSS 0'

    - name: Publicar Artefacto HTML Profundo
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Reporte-SCA-OWASP-HTML
        path: reports/dependency-check-report.html
  # -------------------------------------------------------------
  # ETAPA 3: Análisis SAST (SonarCloud + Artefacto Local)
  # -------------------------------------------------------------
  sast-sonarcloud:
    name: 3. Análisis SAST (SonarCloud)
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: SAST - Iniciar SonarCloud
      run: |
        dotnet-sonarscanner begin \
          /k:"cesarrhf_devsecops-demo" \
          /o:"tarea4-testing" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.qualitygate.wait=true

    - name: Compilar y capturar logs de análisis
      run: |
        echo "==========================================" > sast-report.txt
        echo "REPORTE DE ANÁLISIS CÓDIGO ESTÁTICO (SAST)" >> sast-report.txt
        echo "==========================================" >> sast-report.txt
        dotnet build --configuration Release "/flp:v=detailed;logfile=build-analysis.log" || true
        cat build-analysis.log >> sast-report.txt

    - name: Publicar Artefacto SAST
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Reporte-Analisis-SAST
        path: sast-report.txt

    - name: SAST - Finalizar SonarCloud
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # -------------------------------------------------------------
  # ETAPA 4: Despliegue a Desarrollo (Exige aprobación de los 3 análisis)
  # -------------------------------------------------------------
  deploy-dev:
    name: 4. Despliegue a Desarrollo
    runs-on: ubuntu-latest
    needs: [sca-security, sca-deep-audit, sast-sonarcloud]
   # if: always() # comentar para test
    steps:
    - name: Simular Despliegue
      run: |
        echo "🚀 Todos los controles de seguridad (SCA y SAST) fueron aprobados con éxito."
        echo "Iniciando despliegue automático en el entorno de Desarrollo (DEV)..."
